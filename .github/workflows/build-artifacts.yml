name: Build library artifacts

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  build:
    name: Build and verify bundles
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run verify

      - name: Upload browser bundles
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: webslinger-${{ github.sha }}
          path: |
            dist/webslinger.js
            dist/webslinger.min.js
            dist/webslinger.dev.js
          if-no-files-found: error
          retention-days: 30
